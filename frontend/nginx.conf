# Adapted from frontend/README.md's already-decided "Вариант A" logging
# strategy (custom log_format without query string, preserving connection
# visibility) -- do not reintroduce the JWT-bearing default $request format
# on the /ws/ location. This decision was already made; this file just
# operationalizes it for the Docker Compose deploy.
log_format combined_no_query '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent"';

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real static file (client-side
    # routes from react-router-dom) is served index.html so the router can
    # take over.
    location / {
        try_files $uri /index.html;

        # index.html references hashed asset filenames (/assets/*.js|css).
        # Without this, a cached stale index.html after a redeploy can point
        # at chunks that no longer exist, producing a blank screen until a
        # hard refresh. Hashed assets under /assets/ are immutable by name
        # and don't need this override -- only the shell document does.
        add_header Cache-Control "no-cache" always;
    }

    # Proxies to the `backend` Docker Compose service (resolved via
    # Compose's built-in DNS on the default bridge network), NOT
    # 127.0.0.1 -- this nginx runs in its own container, separate from
    # backend's.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade + the query-string-stripped access log for the JWT
    # token carried in `/ws/job-runs/{id}?token=...` (see
    # frontend/README.md "Прод: nginx и WebSocket-токен в query string").
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        access_log /var/log/nginx/ws_access.log combined_no_query;
    }
}
