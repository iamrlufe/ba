# Build context: backend ("Dockerfile", context: .) and bot ("bot/Dockerfile",
# context: .) both use the repo root as build context, because they COPY
# app ./app / COPY alembic ./alembic (backend) and COPY app ./app + COPY bot
# ./bot (bot) -- paths outside their own subdirectory. Do NOT change either
# to `build: ./<dir>` shorthand, which would set context=./<dir> and break
# both COPY instructions.
#
# frontend is DIFFERENT: it is a fully self-contained npm package with no
# dependency on anything outside frontend/, so its build context is
# ./frontend (not the repo root) -- this is deliberate, not an oversight, do
# not "fix" it to match backend/bot's context: . pattern.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/srv/app/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - bot/.env
    # bot/.env.example ships defaults meant for a non-compose/host deploy
    # (BOT_API_BASE_URL=http://localhost:8000, BOT_STATE_DB_PATH=./bot_state.db,
    # which resolves under bot/Dockerfile's WORKDIR /srv/app, NOT the
    # bot_data volume below -- same relative-path data-loss class of bug
    # DATABASE_URL had). `environment:` here overrides whatever bot/.env
    # sets, so this works correctly under compose without requiring an
    # operator to hand-edit bot/.env.
    environment:
      BOT_API_BASE_URL: http://backend:8000
      BOT_STATE_DB_PATH: /srv/app/data/bot_state.db
    volumes:
      - bot_data:/srv/app/data
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at `vite build` time (see
        # frontend/Dockerfile's ARG/ENV comment) -- NOT read at container
        # runtime. Explicit here even though it matches the Dockerfile's own
        # default, for the same self-documentation reasons the `bot` service
        # restates BOT_API_BASE_URL/BOT_STATE_DB_PATH explicitly.
        VITE_API_BASE_URL: /api
    ports:
      - "8090:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  bot_data:
